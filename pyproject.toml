[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pytonika"
version = "0.4.0"
description = "Python client library for the Teltonika Networks Web API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Iker García Calviño", email = "iker.gcalvino@udc.es" }
]

keywords = ["teltonika", "api", "python", "networking", "routers", "gateways", "access-points", "switches"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Topic :: Communications",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.28.1"
]

[project.optional-dependencies]
lint = ["ruff>=0.15.20"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "respx>=0.23.1"]
type = ["ty>=0.0.57"]
build = ["build>=1.5.0", "twine>=6.2.0"]
dev = ["pytonika[lint,test,type,build]"]

[project.urls]
Homepage = "https://github.com/ikergcalvino/pytonika"
Documentation = "https://github.com/ikergcalvino/pytonika#readme"
Repository = "https://github.com/ikergcalvino/pytonika.git"
Issues = "https://github.com/ikergcalvino/pytonika/issues"
Changelog = "https://github.com/ikergcalvino/pytonika/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytonika*"]
exclude = ["tests*", "venv*", "dist*", "build*", "*.egg-info*"]

[tool.setuptools.package-data]
pytonika = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20"]
ignore = ["F403", "F405"]
per-file-ignores = { "__init__.py" = ["I001", "RUF022"], "tests/*" = ["ANN"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pytonika --cov-report=term-missing --cov-fail-under=80"

[tool.ty.environment]
python-version = "3.10"
