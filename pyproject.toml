[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytonika"
version = "0.4.0"
description = "Typed Python client for the Teltonika Networks Web API: routers, gateways, access points and switches."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Iker García Calviño", email = "iker.gcalvino@udc.es" },
]
keywords = [
  "teltonika",
  "teltonika-networks",
  "web-api",
  "api-client",
  "rest",
  "networking",
  "automation",
  "iot",
  "router",
  "gateway",
  "access-point",
  "switch",
  "rutos",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
]

[project.optional-dependencies]
lint = ["ruff>=0.16.10"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "respx>=0.23.1"]
type = ["ty>=0.0.84"]
build = ["build>=1.6.1", "twine>=7.0.0"]
dev = ["pytonika[lint,test,type,build]"]

[project.urls]
Homepage = "https://github.com/ikergcalvino/pytonika"
Documentation = "https://github.com/ikergcalvino/pytonika#readme"
Repository = "https://github.com/ikergcalvino/pytonika.git"
Issues = "https://github.com/ikergcalvino/pytonika/issues"
Changelog = "https://github.com/ikergcalvino/pytonika/releases"

# --- Packaging ---------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["pytonika*"]

[tool.setuptools.package-data]
pytonika = ["py.typed"]

# --- Linting and formatting --------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20"]
# Star imports are the established pattern in device modules.
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001", "RUF022"]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Type checking -----------------------------------------------------------

[tool.ty.environment]
python-version = "3.11"

# --- Testing -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov"]
xfail_strict = true

[tool.coverage.run]
source = ["pytonika"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
