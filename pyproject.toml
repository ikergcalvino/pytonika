[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytonika"
version = "0.5.0"
description = "Typed Python client for the Teltonika Networks Web API: routers, gateways, access points and switches."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Iker García Calviño", email = "iker.gcalvino@udc.es" },
]
keywords = [
  "teltonika",
  "teltonika-networks",
  "web-api",
  "api-client",
  "rest",
  "networking",
  "automation",
  "iot",
  "router",
  "gateway",
  "access-point",
  "switch",
  "rutos",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/ikergcalvino/pytonika"
Documentation = "https://github.com/ikergcalvino/pytonika#readme"
Repository = "https://github.com/ikergcalvino/pytonika.git"
Issues = "https://github.com/ikergcalvino/pytonika/issues"
Changelog = "https://github.com/ikergcalvino/pytonika/releases"

# --- Development dependencies -----------------------------------------------
# PEP 735 groups: not published with the package. Install with `pip install --group <name>`.

[dependency-groups]
lint = ["ruff>=0.17.1"]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "respx>=0.23.1"]
type = ["ty>=0.0.89"]
build = ["build>=1.6.1", "twine>=7.0.0"]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "type" },
  { include-group = "build" },
]

# --- Packaging ---------------------------------------------------------------

[tool.setuptools.packages.find]
include = ["pytonika*"]

[tool.setuptools.package-data]
pytonika = ["py.typed"]

# --- Linting and formatting --------------------------------------------------
# Ruff and ty take the target Python version from `requires-python`.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "ANN", "B", "C4",
  "D101", "D102", "D103",  # every public class, method and function has a docstring
  "E", "F", "FURB", "I", "N", "PERF", "PIE", "PT", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]  # packages re-export their modules with star imports
"pytonika/devices/**" = ["F403", "F405"]  # generated device classes import every endpoint class
"pytonika/endpoints/__init__.py" = ["RUF022"]  # __all__ follows the import order, by module
"tests/*" = ["D"]

# --- Testing -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["pytonika"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
