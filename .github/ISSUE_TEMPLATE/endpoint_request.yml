name: New endpoint request
description: Request support for a new API endpoint for a Teltonika device.
title: "[Endpoint]: <name>"
labels: ["new endpoint"]
assignees: []

body:
  - type: input
    id: endpoint_name
    attributes:
      label: Endpoint name
      description: Name of the endpoint (e.g., BGP, SMSGateway, OpenVPN).
      placeholder: "BGP"
    validations:
      required: true

  - type: dropdown
    id: device_type
    attributes:
      label: Device type
      description: Select the type of device this endpoint applies to.
      options:
        - Router
        - Gateway
        - Access Point
        - Switch
        - All / Multiple
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      description: Specific device model, if applicable.
      placeholder: "RUTX50"
    validations:
      required: false

  - type: input
    id: endpoint_path
    attributes:
      label: API path
      description: The API path for this endpoint, if known.
      placeholder: "/api/bgp/config"
    validations:
      required: false

  - type: input
    id: documentation_link
    attributes:
      label: API documentation link
      description: Link to the Teltonika API documentation for this endpoint.
      placeholder: "https://developers.teltonika-networks.com/..."
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional context
      description: Any other relevant information (parameters, expected output, use case, etc.).
    validations:
      required: false
