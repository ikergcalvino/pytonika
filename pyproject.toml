[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytonika"
version = "0.3.0"
description = "Python client library for the Teltonika API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
  { name = "Iker García Calviño", email = "iker.gcalvino@udc.es" }
]

keywords = ["teltonika", "api", "python", "networking", "routers", "gateways", "access-points", "switches"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
  "Topic :: Communications",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "httpx>=0.28.1"
]

[project.optional-dependencies]
lint = ["ruff>=0.9.0"]
test = ["pytest>=8.0", "pytest-cov>=6.0", "respx>=0.22.0"]
type = ["mypy>=1.14.0"]
build = ["build>=1.2.0", "twine>=6.0.0"]
dev = ["pytonika[lint,test,type,build]"]

[project.urls]
Homepage = "https://github.com/ikergcalvino/pytonika"
Documentation = "https://github.com/ikergcalvino/pytonika#readme"
Repository = "https://github.com/ikergcalvino/pytonika.git"
Issues = "https://github.com/ikergcalvino/pytonika/issues"
Changelog = "https://github.com/ikergcalvino/pytonika/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytonika*"]
exclude = ["tests*", "venv*", "dist*", "build*", "*.egg-info*"]

[tool.setuptools.package-data]
pytonika = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ANN", "PTH", "T20"]
ignore = ["F403", "F405"]
per-file-ignores = { "__init__.py" = ["I001", "RUF022"], "tests/*" = ["ANN"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pytonika --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
