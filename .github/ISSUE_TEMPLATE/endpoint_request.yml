name: Missing or incorrect endpoint
description: An endpoint documented by Teltonika is missing, or a method sends the wrong request.
title: "[Endpoint]: <path>"
labels: ["new endpoint"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Pytonika's endpoints are generated from the official [Teltonika Web API reference](https://developers.teltonika-networks.com/).
        The firmware version and the documentation link below are what is needed to regenerate them.

  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - The endpoint is missing
        - The method sends the wrong path, method or body
        - The endpoint is missing on a specific device model
    validations:
      required: true

  - type: input
    id: endpoint_path
    attributes:
      label: API path and method
      description: As shown in the Teltonika documentation.
      placeholder: "GET /bgp/instance/config"
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      placeholder: "RUTX50"
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Firmware version
      placeholder: "RUTX_R_00.07.24.5"
    validations:
      required: true

  - type: input
    id: documentation_link
    attributes:
      label: API documentation link
      description: Link to this endpoint in the Teltonika Web API reference.
      placeholder: "https://developers.teltonika-networks.com/..."
    validations:
      required: true

  - type: textarea
    id: additional_info
    attributes:
      label: Additional context
      description: Current behavior, the device's response, or anything else relevant.
    validations:
      required: false
