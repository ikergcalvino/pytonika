name: New device request
description: Request support for a new Teltonika device model.
title: "[Device]: <model>"
labels: ["new device"]
assignees: []

body:
  - type: dropdown
    id: device_type
    attributes:
      label: Device type
      description: Select the type of Teltonika device.
      options:
        - Router
        - Gateway
        - Access Point
        - Switch
    validations:
      required: true

  - type: input
    id: device_model
    attributes:
      label: Device model
      description: Provide the exact model (e.g., RUT240, RUT955, RUTX11).
      placeholder: "RUTX11"
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Firmware version
      description: Firmware version of the device, if known.
      placeholder: "RUTX_R_00.07.08"
    validations:
      required: false

  - type: input
    id: documentation_link
    attributes:
      label: API documentation link
      description: Link to the Teltonika API documentation for this device.
      placeholder: "https://developers.teltonika-networks.com/..."
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: Additional context
      description: Any other relevant information (special features, use case, etc.).
    validations:
      required: false
